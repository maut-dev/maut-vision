name: Feature request
description: Suggest an idea or an improvement
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for the suggestion! Please check that a similar request does not exist yet.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work from the user's point of view?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds or other solutions you considered.
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Projects and library
        - Classes and variants
        - Images and annotation
        - Backgrounds
        - Generation
        - Datasets
        - Training
        - Models
        - Checks
        - Overview and analytics
        - Installer and updates
        - Documentation
        - Other
